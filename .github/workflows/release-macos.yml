name: Release (macOS)

# Builds the Reachy Mini Flasher macOS installers (.dmg) and attaches them to a
# GitHub release. Triggered by pushing a version tag (e.g. `v0.1.0`), or
# manually via the Actions tab.
#
# Two runners produce native builds so both Mac architectures are covered:
#   - macos-14  -> Apple Silicon (aarch64)
#   - macos-13  -> Intel        (x86_64)
# Each runner builds `rpiboot` from source for its own arch, so the bundled
# helper always matches the app it ships in.
#
# Code signing / notarization is OPTIONAL: if the APPLE_* secrets are set the
# build is signed + notarized, otherwise an unsigned build is produced (users
# then have to right-click > Open the first time).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install rpiboot build deps
        run: brew install libusb pkg-config

      - name: Build & stage rpiboot (+ mass-storage-gadget64)
        run: ./scripts/fetch-rpiboot.sh

      - name: Install JS dependencies
        run: npm ci

      - name: Build & release the macOS app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Updater signing (minisign) --------------------------------------
          # Signs the bundle + generates `latest.json` so the in-app self-update
          # (tauri-plugin-updater) can verify and install new versions. The
          # matching public key lives in `tauri.conf.json > plugins.updater`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- Code signing + notarization: intentionally DISABLED -------------
          # We do NOT reference any APPLE_* secret here on purpose: the
          # pollen-robotics org exposes APPLE_* secrets (for the mobile app) that
          # would otherwise be injected and make tauri-action attempt (and fail)
          # a codesign with an incompatible certificate. Producing an unsigned
          # build instead (users right-click > Open on first launch).
          # To enable signing later, add repo-level APPLE_* secrets in the format
          # tauri expects and re-add them here (see https://tauri.app/distribute/sign/macos/).
        with:
          # If the flasher lives in a subfolder of the repo, set projectPath here.
          projectPath: .
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: 'Reachy Mini Flasher ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
