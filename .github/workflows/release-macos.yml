name: Release (macOS)

# Builds the Reachy Mini Flasher macOS installers (.dmg) and attaches them to a
# GitHub release. Triggered by pushing a version tag (e.g. `v0.1.0`), or
# manually via the Actions tab.
#
# Native Apple Silicon (aarch64) build on macos-15. Intel (macos-13) was
# dropped: GitHub retired those runners and jobs never got picked up.
# `rpiboot` is built from source on the runner, so the bundled helper always
# matches the app it ships in.
#
# The app is signed with Pollen's Developer ID and notarized with an App Store
# Connect API key (repo secrets APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_API_KEY, APPLE_API_KEY_CONTENT,
# APPLE_API_ISSUER), so it opens without any Gatekeeper prompt. Local builds
# fall back to the ad-hoc `bundle.macOS.signingIdentity: "-"`.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install rpiboot build deps
        run: brew install pkg-config

      - name: Build & stage rpiboot (+ mass-storage-gadget64)
        run: ./scripts/fetch-rpiboot.sh

      - name: Install JS dependencies
        run: npm ci

      # Imported by hand rather than through `APPLE_CERTIFICATE` because rpiboot
      # has to be signed before tauri-action runs (next step).
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Tauri signs the app, its frameworks and `externalBin` sidecars, but not
      # `resources`: notarization rejects any executable left ad-hoc signed.
      - name: Sign rpiboot with the Developer ID
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" src-tauri/binaries/rpiboot/rpiboot
          codesign --verify --strict --verbose=2 src-tauri/binaries/rpiboot/rpiboot

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize & release the macOS app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Updater signing (minisign) --------------------------------------
          # Signs the bundle + generates `latest.json` so the in-app self-update
          # (tauri-plugin-updater) can verify and install new versions. The
          # matching public key lives in `tauri.conf.json > plugins.updater`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- Code signing + notarization -------------------------------------
          # Repo-level secrets, which take precedence over the org's APPLE_*
          # ones (those belong to the mobile app's distribution certificate).
          # The certificate is already in the keychain imported above, so
          # APPLE_CERTIFICATE is deliberately not passed here.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          # If the flasher lives in a subfolder of the repo, set projectPath here.
          projectPath: .
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: 'Reachy Mini Flasher ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Check Gatekeeper accepts the app
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Reachy Mini Flasher.app"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
